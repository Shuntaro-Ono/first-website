<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuntaro's Post Office</title>
<meta name="description" content="デジタル郵便局。あなた宛の手紙を、レターボックス番号で受け取れます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Zen+Old+Mincho:wght@600&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Courier+Prime:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <div class="hero-text">
      <h1>Shuntaro's Post Office</h1>
      <p class="subtitle">CHIANG MAI, THAILAND</p>
    </div>
    <div class="clocks">
      <div class="clock">
        <div class="clock-face" id="clockTokyo">
          <div class="hand hour"></div>
          <div class="hand minute"></div>
          <div class="hand second"></div>
          <div class="clock-center"></div>
        </div>
        <div class="clock-label">TOKYO<span>JST</span></div>
      </div>
      <div class="clock">
        <div class="clock-face" id="clockChiangMai">
          <div class="hand hour"></div>
          <div class="hand minute"></div>
          <div class="hand second"></div>
          <div class="clock-center"></div>
        </div>
        <div class="clock-label">CHIANG MAI<span>ICT</span></div>
      </div>
    </div>
  </header>

  <main>
    <section class="shelf-section">
      <h2 class="section-title">SHELF</h2>
      <div class="shelf" id="shelf"></div>
    </section>

    <section class="postboxes-section">
      <h2 class="section-title light">POST BOXES</h2>
      <div class="postboxes" id="postboxes"></div>

      <div class="terminal">
        <div class="terminal-box">

          <div class="step" id="stepName">
            <p>デジタル郵便局にようこそ。</p>
            <p>まずはお名前を教えてください。</p>
            <div class="input-row">
              <input type="text" id="nameInput" placeholder="なまえをにゅうりょく" autocomplete="off">
              <button id="nameSubmit" aria-label="次へ">▶</button>
            </div>
          </div>

          <div class="step hidden" id="stepBox">
            <p>あなた宛のお手紙が届いています。</p>
            <p>レターボックス番号をご入力ください。</p>
            <div class="input-row">
              <input type="text" id="boxInput" name="letterbox-code" placeholder="000" maxlength="3" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">
              <button id="boxSubmit">開ける</button>
            </div>
            <p class="error hidden" id="boxError">お名前またはレターボックス番号が見つかりませんでした。</p>
            <button class="link-back" id="backToName">← なまえをかえる</button>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>LIVING IN CHIANG MAI · MADE WITH LOVE</p>
  </footer>

  <!-- 手紙モーダル -->
  <div class="modal-overlay hidden" id="letterModal">
    <div class="letter-card">
      <div class="postal-stamp">✉<span>POSTAL</span></div>
      <div class="letter-date" id="letterDate"></div>
      <div class="letter-body" id="letterBody"></div>
      <div class="letter-signature" id="letterSignature"></div>
      <div class="letter-actions">
        <button class="reply-btn" id="replyBtn">✉ 返信を書く</button>
      </div>
      <button class="close-link" id="closeLetterModal">閉じる</button>
    </div>
  </div>

  <!-- 返信モーダル -->
  <div class="modal-overlay hidden" id="replyModal">
    <div class="reply-card">
      <h3>返信を書く</h3>
      <form id="replyForm">
        <input type="text" name="お名前" id="replyName" placeholder="お名前" required>
        <textarea name="メッセージ" id="replyMessage" rows="6" placeholder="返信メッセージを入力してください" required></textarea>
        <input type="hidden" name="_subject" value="Shuntaro's Post Officeへの返信">
        <button type="submit" id="replySubmit">送信する</button>
      </form>
      <p class="reply-status" id="replyStatus"></p>
      <button class="close-link" id="closeReplyModal">閉じる</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
